server:
  port: 8089


spring:
  application:
    name: SMS-GATEWAY
  main:
    allow-circular-references: true
  config:
    import: file:env.properties
  datasource:
    url: ${DB-URL}
    username: ${DB-USERNAME}
    password: ${DB-PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  mail:
    host: smtp.gmail.com
    username: ${MAIL-USERNAME}
    password: ${MAIL-PASSWORD}
    port: 587
    properties:
      mail:
        smtp:
          ssl:
            trust: smtp.gmail.com
          #          auth: true
          starttls:
            enable: true
  jpa:
    hibernate:
      #      ddl-auto: update
      naming:
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      ddl-auto: none
    database-platform: org.hibernate.dialect.SQLServer2012Dialect
#    show-sql: true

#    allow-circular-references: true
  #    allow-bean-definition-overriding: true
  #    web-application-type: none

  servlet:
    multipart:
      enabled: true
      max-file-size: 2MB
      max-request-size: 2MB
  task:
    execution:
      pool:
        core-size: 10
        max-size: 20
        queue-capacity: 25
logging:
  pattern:
    file: '%date| %-5level | %-30thread | hudhud-sms-gateway | %-30.30logger{0} -%line
      |%msg%n'
    console: '%date| %highlight(%-5level) | %magenta(%-30thread) | hudhud-sms-gateway
      | %-30.30logger{0} -%line |%msg%n'
  file:
    path: E:\services\SMS-GATEWAY-PROD\logs
    name: ${logging.file.path}/sms-gateway-log.log